<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | Login & Signup</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            background: hsl(var(--background));
        }
        .auth-hero {
            flex: 1;
            position: relative;
            display: none;
        }
        @media (min-width: 1024px) {
            .auth-hero { display: block; }
        }
        .auth-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .auth-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, hsla(var(--background), 0.8), transparent);
            display: flex;
            align-items: center;
            padding: 4rem;
        }
        .auth-form-section {
            width: 100%;
            max-width: 500px;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: hsl(var(--muted-foreground));
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0;
            margin-right: 2rem;
            text-transform: uppercase;
        }
        .tab-btn.active {
            color: white;
            border-bottom: 2px solid hsl(var(--accent));
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 3rem;
        }
        .auth-form.active {
            display: flex;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: hsl(var(--muted-foreground));
        }
        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem;
            color: white;
            border-radius: var(--radius);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-hero">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=2000" alt="Luxury Car">
            <div class="auth-hero-overlay">
                <div>
                    <h1 style="font-size: 3rem; color: white; margin-bottom: 1rem;">VELOCITY</h1>
                    <p style="color: #d1d5db; font-size: 1.25rem; max-width: 400px;">Experience the pinnacle of automotive engineering. Join our exclusive community.</p>
                </div>
            </div>
        </div>
        <div class="auth-form-section">
            <div style="display: flex; margin-bottom: 1rem;">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Signup</button>
            </div>
            
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="height: 3.5rem;">Login to Velocity</button>
            </form>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="height: 3.5rem;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Account created! Please login.');
                switchTab('login');
            } else {
                const err = await res.json();
                alert(err.message || 'Signup failed');
            }
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                alert('Invalid credentials');
            }
        };
    </script>
</body>
</html>
