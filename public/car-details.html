<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details | Velocity</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-foreground">
    <header id="header" class="header header-default">
        <div class="container nav">
            <a href="index.html" class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                </div>
                <span class="brand-text">VELOCITY</span>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="inventory.html" class="nav-link">Inventory</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div style="display: none;" class="md:block">
                <a href="inventory.html" class="btn btn-outline" style="border-radius: 0;">Find Your Vehicle</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 8rem; padding-bottom: 6rem;" id="car-details">
        <!-- Details JS -->
    </main>

    <!-- Reservation Modal -->
    <div id="reservation-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem;">
        <div style="background: hsl(var(--card)); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px; border-radius: 0.25rem; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-size: 1.5rem;">&times;</button>
            <div style="padding: 2.5rem;">
                <h2 style="font-size: 1.5rem; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Complete Reservation</h2>
                <p style="color: #a1a1aa; font-size: 0.875rem; margin-bottom: 2rem;">Please provide your details to reserve this vehicle.</p>
                
                <form id="reservation-form" onsubmit="handleReservation(event)" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div style="background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: var(--radius); border: 1px solid hsl(var(--accent));">
                        <h3 style="font-size: 0.875rem; color: hsl(var(--accent)); margin-bottom: 0.5rem;">Reservation Summary</h3>
                        <div style="display: flex; justify-content: space-between; color: white;">
                            <span>Security Deposit (50%)</span>
                            <span id="reservation-amount-display">PKR 0</span>
                        </div>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #6b7280; margin-bottom: 0.5rem;">Card Number</label>
                        <input type="text" name="cardNumber" placeholder="1234 5678 9101 1121" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; color: white; border-radius: 0.125rem;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #6b7280; margin-bottom: 0.5rem;">Expiry Date</label>
                            <input type="text" name="expiryDate" placeholder="MM/YY" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; color: white; border-radius: 0.125rem;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #6b7280; margin-bottom: 0.5rem;">CVV</label>
                            <input type="password" name="cvv" placeholder="123" required style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; color: white; border-radius: 0.125rem;">
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="height: 3.5rem; font-weight: 700; text-transform: uppercase; margin-top: 1rem;">
                        Confirm Reservation
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer style="background: hsl(var(--background)); border-top: 1px solid rgba(255,255,255,0.1); padding: 5rem 0 2.5rem;">
        <div class="container">
            <p style="color: #a1a1aa; font-size: 0.75rem; text-transform: uppercase; text-align: center; letter-spacing: 0.1em;">© 2026 Velocity Automotive Group. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/details.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 20) {
                header.classList.remove('header-default');
                header.classList.add('header-scrolled');
            } else {
                header.classList.remove('header-scrolled');
                header.classList.add('header-default');
            }
        });
    </script>
</body>
</html>
