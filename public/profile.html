<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | My Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .profile-container {
            display: flex;
            min-height: 100vh;
            background: hsl(var(--background));
        }
        .profile-hero {
            flex: 1;
            position: relative;
            display: none;
        }
        @media (min-width: 1024px) {
            .profile-hero { display: block; }
        }
        .profile-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, hsla(var(--background), 0.9), transparent);
            display: flex;
            align-items: center;
            padding: 4rem;
        }
        .profile-form-section {
            width: 100%;
            max-width: 600px;
            padding: 8rem 2rem 4rem;
            display: flex;
            flex-direction: column;
        }
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #6b7280;
        }
        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem;
            color: white;
            border-radius: var(--radius);
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-background">
    <header id="header" class="header header-scrolled">
        <div class="container nav">
            <a href="index.html" class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                </div>
                <span class="brand-text">VELOCITY</span>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="inventory.html" class="nav-link">Inventory</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <div id="user-dropdown" style="position: relative; display: none;">
                    <button id="user-display-btn" class="nav-link nav-link-active" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <span id="user-name">User</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="dropdown-content" style="display: none; position: absolute; top: 100%; right: 0; background: hsl(var(--card)); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.25rem; min-width: 150px; z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);">
                        <a href="profile.html" style="display: block; padding: 0.75rem 1rem; color: white; text-decoration: none; font-size: 0.875rem;" class="hover:bg-white/5">Profile</a>
                        <button id="logout-btn-dropdown" style="width: 100%; text-align: left; background: none; border: none; padding: 0.75rem 1rem; color: #ef4444; cursor: pointer; font-size: 0.875rem;" class="hover:bg-white/5">Logout</button>
                    </div>
                </div>
                <a href="auth.html" id="auth-link" class="nav-link">Login</a>
            </nav>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-hero">
            <img src="https://images.unsplash.com/photo-1544636331-e268592033c2?auto=format&fit=crop&q=80&w=2000" alt="Luxury Car Detail">
            <div class="profile-hero-overlay">
                <div>
                    <h1 style="font-size: 3rem; color: white; margin-bottom: 1rem;">YOUR PROFILE</h1>
                    <p style="color: #d1d5db; font-size: 1.25rem; max-width: 400px;">Manage your account details and payment preferences for a seamless reservation experience.</p>
                </div>
            </div>
        </div>
        <div class="profile-form-section">
            <h2 class="section-title">Personal Information</h2>
            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullName" id="p-fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" id="p-username" readonly style="opacity: 0.6;">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" id="p-email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" id="p-phone">
                    </div>
                </div>

                <h2 class="section-title">Saved Payment Method</h2>
                <div class="form-grid">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Card Number</label>
                        <input type="text" name="cardNumber" id="p-cardNumber" placeholder="xxxx xxxx xxxx xxxx">
                    </div>
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="text" name="expiryDate" id="p-expiryDate" placeholder="MM/YY">
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="password" name="cvv" id="p-cvv" placeholder="***">
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="height: 3.5rem; font-weight: 700; text-transform: uppercase;">Update Profile</button>
                    <button type="button" id="profile-logout-btn" class="btn btn-outline" style="height: 3.5rem; font-weight: 700; text-transform: uppercase; color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">Logout</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) window.location.href = 'auth.html';
        const user = JSON.parse(userStr);

        // Header Logic
        document.getElementById('auth-link').style.display = 'none';
        document.getElementById('user-dropdown').style.display = 'block';
        document.getElementById('user-name').innerText = user.fullName;
        
        const displayBtn = document.getElementById('user-display-btn');
        const dropdown = document.getElementById('dropdown-content');
        
        displayBtn.onclick = (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        };
        
        document.addEventListener('click', () => {
            dropdown.style.display = 'none';
        });

        // Profile Data
        document.getElementById('p-fullName').value = user.fullName || '';
        document.getElementById('p-username').value = user.username || '';
        document.getElementById('p-email').value = user.email || '';
        document.getElementById('p-phone').value = user.phone || '';
        document.getElementById('p-cardNumber').value = user.cardNumber || '';
        document.getElementById('p-expiryDate').value = user.expiryDate || '';
        document.getElementById('p-cvv').value = user.cvv || '';

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const res = await fetch(`/api/users/${user.id}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    const updatedUser = await res.json();
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    alert('Profile updated successfully!');
                    window.location.reload();
                } else {
                    alert('Failed to update profile');
                }
            } catch (err) {
                alert('Error updating profile');
            }
        };

        const logout = () => {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        };

        document.getElementById('logout-btn-dropdown').onclick = logout;
        document.getElementById('profile-logout-btn').onclick = logout;
    </script>
</body>
</html>
