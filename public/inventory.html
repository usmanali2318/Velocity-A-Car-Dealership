<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Velocity</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-foreground">
    <header id="header" class="header header-default">
        <div class="container nav">
            <a href="index.html" class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                </div>
                <span class="brand-text">VELOCITY</span>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="inventory.html" class="nav-link nav-link-active">Inventory</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div style="display: none;" class="md:block">
                <a href="inventory.html" class="btn btn-outline" style="border-radius: 0;">Find Your Vehicle</a>
            </div>
        </div>
    </header>

    <div style="background: hsl(var(--card)); border-bottom: 1px solid rgba(255,255,255,0.05); padding-top: 8rem; padding-bottom: 3rem;">
        <div class="container" style="text-align: center;">
            <h1 style="font-size: 2.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: white; margin-bottom: 1rem;">Our Inventory</h1>
            <p style="color: hsl(var(--muted-foreground)); max-width: 42rem; margin: 0 auto;">Explore our extensive collection of premium vehicles, each selected for its exceptional quality and performance.</p>
        </div>
    </div>

    <div class="container" style="padding: 3rem 0;">
        <div class="inventory-layout">
            <!-- Sidebar Filters -->
            <aside class="sidebar lg:block hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3 style="font-weight: 700; font-size: 1.25rem; color: white; text-transform: uppercase;">Filter By</h3>
                    <button onclick="resetFilters()" style="background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;">Reset All</button>
                </div>

                <div style="margin-bottom: 2.5rem;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7280; margin-bottom: 1.25rem;">Category</label>
                    <div id="category-filters" style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <!-- Categories JS -->
                    </div>
                </div>

                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7280; margin-bottom: 1.25rem;">Exterior Color</label>
                    <div id="color-filters" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
                        <!-- Colors JS -->
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <div style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <span id="results-count" style="font-size: 0.875rem; color: #a1a1aa;">0 Vehicles Found</span>
                    <select id="sort-select" onchange="updateSort(this.value)" style="background: transparent; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 0.5rem 1rem; border-radius: 0.125rem; font-size: 0.875rem;">
                        <option value="price_desc">Price: High to Low</option>
                        <option value="price_asc">Price: Low to High</option>
                    </select>
                </div>

                <div id="inventory-grid">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </div>
    </div>

    <footer style="background: hsl(var(--background)); border-top: 1px solid rgba(255,255,255,0.1); padding: 5rem 0 2.5rem;">
        <div class="container">
            <p style="color: #a1a1aa; font-size: 0.75rem; text-transform: uppercase; text-align: center; letter-spacing: 0.1em;">© 2026 Velocity Automotive Group. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/inventory.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 20) {
                header.classList.remove('header-default');
                header.classList.add('header-scrolled');
            } else {
                header.classList.remove('header-scrolled');
                header.classList.add('header-default');
            }
        });
    </script>
</body>
</html>
